name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'testresults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pester-results-${{ matrix.os }}
          path: testresults.xml

  linux-shells:
    name: Linux shells (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # zsh + fish so the generated init scripts get syntax- and run-checked;
      # pwsh ships on the runner, so the prompt parity test runs too.
      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Run tests
        run: python -m unittest discover -s linux/tests -t linux/tests -v

  gallery-sync:
    name: Gallery sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fails if docs/themes.html theme cards drift from palettes/*.json
      # (the "site == reality" rule in CONTRIBUTING.md). Pure stdlib python3.
      - name: Check gallery is in sync with palette JSON
        run: python3 tools/check-gallery-sync.py
