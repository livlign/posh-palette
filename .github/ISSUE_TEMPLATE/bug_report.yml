name: 🐛 Bug report
description: Something isn't applying or looking right
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer?
      description: Which part of the look is affected?
      multiple: true
      options:
        - Windows Terminal (scheme / background / opacity / font)
        - Linux terminal (Ghostty / kitty / Alacritty / foot / OSC colors)
        - PSReadLine (the command line you type)
        - Linux shell input colors (zsh / fish / ble.sh)
        - $PSStyle (command output — dirs, errors, tables)
        - LS_COLORS / GREP_COLORS (Linux command output)
        - oh-my-posh (the prompt)
        - The picker / TUI itself
        - Install / update / setup
        - Not sure
    validations:
      required: true
  - type: input
    id: ppversion
    attributes:
      label: PoshPalette version
      description: "`(Get-Module PoshPalette -ListAvailable).Version`, or `palette --version` on Linux"
      placeholder: "0.8.2"
    validations:
      required: true
  - type: input
    id: psversion
    attributes:
      label: PowerShell version, or Linux shell
      description: "`$PSVersionTable.PSVersion`, or e.g. `zsh 5.9` / `bash 5.2` / `fish 4.0`"
      placeholder: "7.4.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS & terminal
      placeholder: "Windows 11 + Windows Terminal 1.19 / Fedora 44 + Ghostty 1.3 / macOS 14 + WezTerm"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install-PoshPaletteTheme eclipse
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: Test-PoshPaletteSetup / palette doctor output (optional)
      description: Paste the output of `Test-PoshPaletteSetup` (or `palette doctor` on Linux) if relevant.
      render: text
